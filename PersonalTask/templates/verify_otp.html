{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | TaskFlow</title>

    <link rel="stylesheet"
          href="{% static 'css/forgot_password.css' %}">

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <div class="logo">
            TaskFlow
        </div>

        <h2>Verify OTP</h2>

        <p class="description">
            Enter the 6-digit OTP to verify your identity.
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="otp">
                    OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    required>

            </div>

            <button
                type="submit"
                class="send-otp-btn">

                Verify OTP

            </button>

        </form>

        <div class="back-login">

            <a href="{% url 'forgot_password' %}">
                ← Back
            </a>

        </div>

    </div>

</div>

</body>

</html>
