<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .login-card{
            width:100%;
            max-width:420px;
            background:#fff;
            padding:40px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo h2{
            color:#4F46E5;
            font-weight:700;
        }

        h3{
            font-weight:700;
            margin-bottom:8px;
            color:#111827;
        }

        p{
            color:#6b7280;
            margin-bottom:25px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

        .form-control:focus{
            border-color:#4F46E5;
            box-shadow:none;
        }

        .password-field{
            position:relative;
            margin-top:20px;
        }

        .password-field input{
            padding-right:45px;
        }

        .password-field i{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#6b7280;
            font-size:18px;
        }

        .password-field i:hover{
            color:#4F46E5;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:#4F46E5;
            color:#fff;
            font-weight:600;
            margin-top:25px;
            transition:.3s;
        }

        .btn-login:hover{
            background:#4338CA;
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
        }

        .bottom-text a{
            text-decoration:none;
            color:#4F46E5;
            font-weight:600;
        }

        .message-box{
            padding:10px;
            border-radius:8px;
            text-align:center;
            margin-bottom:20px;
            font-size:15px;
        }

        .success{
            background:#ecfdf5;
            color:#166534;
            border:1px solid #bbf7d0;
        }

        .error{
            background:#fef2f2;
            color:#b91c1c;
            border:1px solid #fecaca;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <h2>TaskFlow</h2>
    </div>

  

    

    {% if messages %}
        {% for message in messages %}
            <div class="message-box {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="username" class="form-control" placeholder="Username" required>

        <div class="password-field">

            <input type="password" name="password" id="password" class="form-control" placeholder="Password" required><i class="bi bi-eye-slash" id="togglePassword"></i>

        </div>

       

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </div>

</div>

<script>

const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.addEventListener("click", function(){

    if(password.type === "password"){
        password.type = "text";
        this.classList.replace("bi-eye-slash","bi-eye");
    }
    else{
        password.type = "password";
        this.classList.replace("bi-eye","bi-eye-slash");
    }

});

setTimeout(function(){

    const message = document.querySelector(".message-box");

    if(message){

        message.style.transition = "0.5s";
        message.style.opacity = "0";

        setTimeout(function(){
            message.remove();
        },500);

    }

},3000);

</script>

</body>
</html>
