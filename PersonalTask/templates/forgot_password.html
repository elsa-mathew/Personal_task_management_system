{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | TaskFlow</title>

    <link rel="stylesheet"
          href="{% static 'css/forgot_password.css' %}">

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <div class="logo">
            TaskFlow
        </div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter your registered email address to
            receive a verification OTP.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>

            </div>

            <button
                type="submit"
                class="send-otp-btn">

                Send OTP

            </button>

        </form>

        <div class="back-login">

            <a href="{% url 'login' %}">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
