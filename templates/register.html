<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TaskFlow</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .register-card{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:18px;
            padding:40px;
            box-shadow:0 10px 35px rgba(0,0,0,.08);
        }

        .register-card h2{
            font-weight:700;
            color:#111827;
        }

        .register-card p{
            color:#6b7280;
            font-size:15px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            margin-bottom:18px;
        }

        .btn-register{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:#4f46e5;
            color:#fff;
            font-weight:600;
            transition:.3s;
        }

        .btn-register:hover{
            background:#4338ca;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            color:#4f46e5;
            text-decoration:none;
            font-weight:600;
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h3{
            color:#4f46e5;
            font-weight:700;
        }

        /*message box*/

        .message-box{
            width:100%;
            padding:12px 16px;
            margin-bottom:20px;
            border-radius:8px;
            font-size:15px;
            font-weight:500;
            text-align:center;
            animation:fadeIn .3s ease;
        }

        .success{
            background:#ecfdf5;
            color:#166534;
            border:1px solid #bbf7d0;
        }

        .error{
            background:#fef2f2;
            color:#b91c1c;
            border:1px solid #fecaca;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(-8px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /*password*/

        .password-field{
            position:relative;
        }

        .password-field input{
            padding-right:45px;
        }

        .password-field i{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:18px;
            color:#6c757d;
        }

        .password-field i:hover{
            color:#4F46E5;
        }

    </style>

</head>
<body>

<div class="register-card">

    <div class="logo">
        <h3>TaskFlow</h3>
    </div>

    <h2>Create Account</h2>
    

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="fullname" class="form-control" placeholder="Full Name">
        <input type="email" name="email" class="form-control" placeholder="Email Address">
        <input type="text" name="username" class="form-control" placeholder="Username">
        <div class="password-field"> <input type="password" id="password" name="password" class="form-control" placeholder="Password"><i class="bi bi-eye-slash" id="togglePassword"></i></div>
        <div class="password-field"> <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm Password"><i class="bi bi-eye-slash" id="toggleConfirmPassword"></i></div>
        <button class="btn-register">Create Account</button>

        {% if messages %}
            {% for message in messages %}
                <div class="message-box {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    </form>

    <div class="login-link">
        Already have an account?<a href="{% url 'login' %}">Login</a>
    </div>

</div>
<script>
setTimeout(function () {
    const message = document.querySelector(".message-box");
    if (message) {
        message.style.transition = "opacity .5s";
        message.style.opacity = "0";

        setTimeout(() => {
            message.remove();
        }, 500);
    }
}, 3000);
</script>

<script>

const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.addEventListener("click", function () {

    const type = password.getAttribute("type") === "password"
        ? "text"
        : "password";

    password.setAttribute("type", type);

    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");

});


const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
const confirmPassword = document.getElementById("confirm_password");

toggleConfirmPassword.addEventListener("click", function () {

    const type = confirmPassword.getAttribute("type") === "password"
        ? "text"
        : "password";

    confirmPassword.setAttribute("type", type);

    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");

});

</script>
</body>
</html>
